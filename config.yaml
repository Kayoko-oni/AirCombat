map:
  width: 1000
  height: 1000
  center: [0, 0, 0]
  path_cell_size: 5.0       # 规划网格分辨率（米）；改成 10 可减少相邻格过近的问题
  use_obj_model: true       # 可视化时优先用 Data/maps 里的 OBJ 城市模型；false 用随机建筑
  buildings:
    # 建筑生成相关配置：支持配置生成数量区间、是否避免 XY 平面重叠、缓冲距离等
    count_min: 180
    count_max: 240
    avoid_overlap: true
    padding: 2.5
    max_attempts_per_building: 2000
  # TODO: 添加边界定义和障碍物
base:
  health: 10000
  position: [-10, -25, 0]
  collision_radius: 20

# 新增多基地配置（向后兼容：若存在 bases 则使用 bases，否则使用 base 下的单基地配置）
bases:
  - name: Base-Alpha
    position: [-10, -25, 0]
    health: 100
    collision_radius: 15
  - name: Base-Bravo
    position: [270, -200, 0]
    health: 100
    collision_radius: 15
  - name: Base-Charlie
    position: [-190, 120, 0]
    health: 100
    collision_radius: 15

simulation:
  fps: 30
  duration: 0
  # 0 表示无限运行时间，直到手动关闭程序
  # TODO: 添加暂停/恢复控制和保存/加载状态

  # 任务分配/CBS 的最小间隔（秒）。策略耗时会自动把实际间隔拉长，避免大编队掉帧
  strategy_interval_s: 0.12

  # 是否启用 Open3D 窗口；false 或无 open3d 时自动无界面运行
  enable_visualization: true

  # 轨迹线每帧都会重建，长时间运行会增加 Open3D 压力；默认关闭，需要时再开
  enable_trails: false

  # 所有存活无人机的最低离地高度（米），避免贴着地面飞
  min_flight_altitude: 5.0

  # 电池消耗速率（点/秒）。5.0 时 60 点电池只能飞 12 秒，攻防还没接触就坠毁；
  # 演示/对抗评估用 0.5，电池寿命 120~240 秒。
  battery_drain_rate: 0.5

  # 生成新进攻无人机的时间间隔（秒）：0.8 表示每秒约 1.25 架
  spawn_interval_min: 0.8
  spawn_interval_max: 0.8
  
  # 最大同时存在的进攻方数量（可视化演示规模；压力测试可自行调大）
  max_offensive: 40
  
  # 防守方自动平衡相关 - 与进攻方保持约 1:1
  defender_ratio: 1.0       # 防守方数量 ≈ 进攻方 * ratio
  defender_interceptor_ratio: 0.65  # 新补充防守方中拦截机占比（更耐撞）
  
  # 进攻方初始化高度分布（低空+高空）
  offensive_spawn_z_low_min: 5.0
  offensive_spawn_z_low_max: 30.0
  offensive_spawn_z_high_min: 80.0
  offensive_spawn_z_high_max: 160.0
  offensive_spawn_high_ratio: 0.5
  # 进攻方低空贴建筑绕行设置
  offensive_obstacle_avoid: true
  offensive_avoid_low_alt_threshold: 50.0 # 越大，更多高度会启用贴建筑绕行
  offensive_avoid_corridor_cells: 1 # 越大，越敏感（更容易触发 A*）
  offensive_avoid_sample_count: 6 # 越大，检测更严格但开销更高
  
  # 反辐射无人机生成概率（提高以增加多样性）
  anti_radiation_spawn_prob: 0.20   # 20%概率生成反辐射无人机
  ew_spawn_prob: 0.15               # 15%概率生成电子战无人机

  
path_planning:
  # 路径重规划相关参数（可在调试时调整）
  replan_distance: 1.0      # 米，目标发生移动超过该距离触发重规划
  replan_cooldown: 2.0      # 秒，重规划的最小间隔
  max_plan_time_ms: 30     # 毫秒，单次 A* 规划的时间上限
  path_tolerance: 1.0       # 米，认为已到达路径点的容差
  plan_speed: 30.0          # 米/秒，CBS 路径执行速度（全体防守方统一，保证时间表可比）
  debug_log: false          # 是否记录重规划日志到 stdout
  # 爬升避障相关（当地面路径被高楼阻挡时，先爬升再继续）
  climb_clearance: 5.0      # 米，爬升到障碍顶端之上所需最小安全距离

assignment:
  # 改进拍卖 + CMA 动态分配参数（默认调优版，可在此直接调参）
  epsilon_start: 0.8 # 贪婪搜索参数
  epsilon_end: 0.002
  epsilon_decay: 0.25
  max_iterations_per_phase: 12000
  regret_weight: 0.15
  warm_start: true
  warm_start_fraction: 0.4
  enable_local_refine: true
  local_refine_rounds: 6

  communication_range: 320.0 # 通信参数
  max_operational_distance: 1200.0
  response_distance_weight: 0.5
  response_energy_weight: 0.35
  response_health_weight: 0.15
  response_threshold: 0.38

  attention_temperature: 0.6 # 约束条件参数
  distance_weight: 1.0
  urgency_weight: 32.0
  load_balance_weight: 20.0
  feasibility_weight: 18.0
  attention_weight: 24.0
  non_responder_penalty: 60.0
  sticky_assignment_bonus: 12.0
  reassignment_penalty: 7.0

  # 高度权重距离配置
  height_weight: 1.5
  use_geographic_coords: true
  geo_origin_lat: 30.1234 # 局部坐标原点（用于地理坐标转换）
  geo_origin_lon: 120.5678
  geo_origin_alt: 15.0
  position_noise_std: 1.0 # 米，位置测量噪声标准差

  # LOS 与相对速度驱动配置
  enable_los: true
  los_height_margin: 2.0
  los_blocked_penalty: 80.0
  enable_relative_speed: true
  relative_speed_weight: 10.0
  relative_speed_ref: 25.0

  # 向量化 + 空间分区配置
  enable_spatial_partition: true
  spatial_cell_size: 120.0
  spatial_query_radius: 1200.0
  out_of_range_penalty: 1000000.0

