    battery: 90.0
  ew:
    speed: 10.0
    max_speed: 32.0
    health: 40.0
    attack_power: 15.0
    battery: 100.0
    jamming_radius: 200.0
  anti_radiation:
    speed: 12.0
    max_speed: 32.0
    health: 45.0
